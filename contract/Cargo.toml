[package]
name = "tilt-house-contract"
version = "0.3.0"
edition = "2021"
description = "Tilt House floor: NPC and player-owned tables as LP pools, seats, rent, jackpot and provably fair sessions (NEAR)"
license = "MIT"
publish = false
# NEP-330 `contract_source_metadata` link (near-sdk reads it at build time).
repository = "https://github.com/STOOOKEEE/tilt-house"

# `cargo near build reproducible-wasm` (run from contract/, committed tree): the image is
# pinned by digest so anyone rebuilds the same wasm bytes (docs/contract-api.md, Build).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
tilt-house-core = { path = "../core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ed25519-dalek = "2"
serde_json = "1"
anyhow = "1"
# near-workspaces pulls native-tls; build OpenSSL from source so tests need no system libssl-dev.
openssl = { version = "0.10", features = ["vendored"] }
