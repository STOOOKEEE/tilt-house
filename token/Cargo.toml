[package]
name = "tilt-house-token"
version = "0.1.0"
edition = "2021"
description = "tUSDC: Tilt House testnet-only NEP-141 test token with no value"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
# near-workspaces pulls native-tls; build OpenSSL from source so tests need no system libssl-dev.
openssl = { version = "0.10", features = ["vendored"] }
