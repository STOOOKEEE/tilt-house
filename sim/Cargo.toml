[package]
name = "tilt-house-sim"
version = "0.1.0"
edition = "2021"
description = "Tilt House fast-forward: a week of dealers, players and LPs on the same rules as the contract"
license = "MIT"

[[bin]]
name = "sim"
path = "src/main.rs"

[dependencies]
tilt-house-core = { path = "../core" }
# Only the pure $TILT rules, without the contract (and near-sdk).
tilt-house-meme = { path = "../meme", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
